---
# Fallback layer for the "Environment Variables" section of an Ansible Semaphore Environment.
#
# Precedence, highest first:
#   1. Extra variables - the task "environment" JSON sent by the backend, survey fields, or -e on the CLI.
#   2. This file       - process environment variables set by the Semaphore Environment.
#   3. Role defaults   - roles/*/defaults/main.yml.
#
# Extra variables outrank vars_files in Ansible, so anything the backend sends per deployment always wins.
# Empty or unset environment variables fall through to the defaults below.

# Connection
vm_ip: "{{ lookup('env', 'VM_IP') | default('', true) }}"
vm_user: "{{ lookup('env', 'VM_USER') | default('root', true) }}"
vm_pass: "{{ lookup('env', 'VM_PASS') | default('', true) }}"
vm_port: "{{ lookup('env', 'VM_PORT') | default('', true) }}"
vm_become_password: "{{ lookup('env', 'VM_BECOME_PASSWORD') | default('', true) }}"
vm_ssh_private_key_b64: "{{ lookup('env', 'VM_SSH_PRIVATE_KEY_B64') | default('', true) }}"
vm_ssh_private_key_file: "{{ lookup('env', 'VM_SSH_PRIVATE_KEY_FILE') | default('', true) }}"

# Placement
workload_type: "{{ lookup('env', 'WORKLOAD_TYPE') | default('qemu', true) }}"

# Application selection
# No default: a missing app_name must fail, not install n8n by accident.
app_name: "{{ lookup('env', 'APP_NAME') | default('', true) }}"

# n8n
n8n_timezone: "{{ lookup('env', 'N8N_TIMEZONE') | default('Asia/Jakarta', true) }}"
n8n_clean_install: "{{ lookup('env', 'N8N_CLEAN_INSTALL') | default('false', true) | bool }}"
n8n_custom_domain: "{{ lookup('env', 'N8N_CUSTOM_DOMAIN') | default('false', true) | bool }}"
n8n_domain: "{{ lookup('env', 'N8N_DOMAIN') | default('', true) }}"
n8n_generated_domain: "{{ lookup('env', 'N8N_GENERATED_DOMAIN') | default('', true) }}"
n8n_basic_auth_user: "{{ lookup('env', 'N8N_BASIC_AUTH_USER') | default('', true) }}"
n8n_basic_auth_password: "{{ lookup('env', 'N8N_BASIC_AUTH_PASSWORD') | default('', true) }}"
n8n_public_port: "{{ lookup('env', 'N8N_PUBLIC_PORT') | default('5178', true) | int }}"
n8n_image: "{{ lookup('env', 'N8N_IMAGE') | default('docker.n8n.io/n8nio/n8n:2.27.4', true) }}"
n8n_worker_concurrency: "{{ lookup('env', 'N8N_WORKER_CONCURRENCY') | default('15', true) | int }}"
n8n_owner_email_strict: "{{ lookup('env', 'N8N_OWNER_EMAIL_STRICT') | default('true', true) | bool }}"

# openclaw
openclaw_timezone: "{{ lookup('env', 'OPENCLAW_TIMEZONE') | default('Asia/Jakarta', true) }}"
openclaw_clean_install: "{{ lookup('env', 'OPENCLAW_CLEAN_INSTALL') | default('false', true) | bool }}"
openclaw_custom_domain: "{{ lookup('env', 'OPENCLAW_CUSTOM_DOMAIN') | default('false', true) | bool }}"
openclaw_domain: "{{ lookup('env', 'OPENCLAW_DOMAIN') | default('', true) }}"
openclaw_generated_domain: "{{ lookup('env', 'OPENCLAW_GENERATED_DOMAIN') | default('', true) }}"
openclaw_gateway_token: "{{ lookup('env', 'OPENCLAW_GATEWAY_TOKEN') | default('', true) }}"
openclaw_public_port: "{{ lookup('env', 'OPENCLAW_PUBLIC_PORT') | default('18789', true) | int }}"
openclaw_image: "{{ lookup('env', 'OPENCLAW_IMAGE') | default('ghcr.io/openclaw/openclaw:latest', true) }}"

# 9router (variables are router9_* because an Ansible variable cannot start with a digit)
router9_timezone: "{{ lookup('env', 'ROUTER9_TIMEZONE') | default('Asia/Jakarta', true) }}"
router9_clean_install: "{{ lookup('env', 'ROUTER9_CLEAN_INSTALL') | default('false', true) | bool }}"
router9_custom_domain: "{{ lookup('env', 'ROUTER9_CUSTOM_DOMAIN') | default('false', true) | bool }}"
router9_domain: "{{ lookup('env', 'ROUTER9_DOMAIN') | default('', true) }}"
router9_generated_domain: "{{ lookup('env', 'ROUTER9_GENERATED_DOMAIN') | default('', true) }}"
router9_initial_password: "{{ lookup('env', 'ROUTER9_INITIAL_PASSWORD') | default('', true) }}"
router9_public_port: "{{ lookup('env', 'ROUTER9_PUBLIC_PORT') | default('20128', true) | int }}"
router9_image: "{{ lookup('env', 'ROUTER9_IMAGE') | default('decolua/9router:latest', true) }}"
