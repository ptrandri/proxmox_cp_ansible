---
# Dynamic entrypoint kept for backward compatibility.
# playbooks/deploy.yml already handles both static inventories and dynamic vm_ip input,
# so this wrapper only enforces that vm_ip was actually supplied.
- name: Require dynamic VM input
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate that vm_ip was provided
      ansible.builtin.assert:
        that:
          - vm_ip is defined
          - vm_ip | string | trim | length > 0
        fail_msg: "playbooks/deploy_dynamic.yml requires vm_ip. Use playbooks/deploy.yml for static inventory deployments."

- ansible.builtin.import_playbook: deploy.yml
