---
# Generated secrets are persisted next to the stack so a redeploy reuses them. Rotating an
# encryption key or a database password on every run would orphan the data already written under it.
- name: Check stored generated secrets
  ansible.builtin.stat:
    path: "{{ app_project_dir }}/.generated-secrets.yml"
  register: app_secret_stat

- name: Read stored generated secrets
  ansible.builtin.slurp:
    src: "{{ app_project_dir }}/.generated-secrets.yml"
  register: app_secret_blob
  when: app_secret_stat.stat.exists
  no_log: true

- name: Load stored generated secrets
  ansible.builtin.set_fact:
    app_stored_secrets: >-
      {{
        (app_secret_blob.content | b64decode | from_yaml | default({}, true))
        if (app_secret_stat.stat.exists and ((app_secret_blob.content | default('')) | length) > 0)
        else {}
      }}
  no_log: true
