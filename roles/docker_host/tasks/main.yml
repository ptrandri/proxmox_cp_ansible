---
- name: Normalize Docker host facts
  ansible.builtin.set_fact:
    docker_host_os_family: "{{ ansible_facts['os_family'] }}"
    docker_host_architecture: "{{ ansible_facts['architecture'] | lower }}"

- name: Validate supported target operating system
  ansible.builtin.assert:
    that:
      - docker_host_os_family == 'Debian'
    fail_msg: "This role currently supports Debian/Ubuntu targets."

- name: Validate supported CPU architecture for Docker Compose plugin
  ansible.builtin.assert:
    that:
      - docker_host_architecture in docker_compose_arch_map
    fail_msg: "Unsupported architecture: {{ docker_host_architecture }}."

- name: Resolve Docker Compose binary architecture
  ansible.builtin.set_fact:
    docker_compose_binary_arch: "{{ docker_compose_arch_map[docker_host_architecture] }}"

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - sudo
      - docker.io
    state: present
    update_cache: true

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  register: docker_host_service_result
  failed_when: false

- name: Validate Docker service started
  ansible.builtin.assert:
    that:
      - not (docker_host_service_result.failed | default(false))
    fail_msg: >-
      Docker could not be started on this {{ docker_host_workload_type | default('qemu') }} workload.
      {% if (docker_host_workload_type | default('qemu')) in ['lxc', 'container'] %}
      An LXC container needs nesting=1 and keyctl=1 set on the Proxmox host before Docker can run inside it.
      {% endif %}
      Service error: {{ docker_host_service_result.msg | default('unknown') }}

- name: Create Docker Compose plugin directory
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker Compose v2 plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ docker_compose_binary_arch }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    owner: root
    group: root
    mode: "0755"

- name: Verify Docker Compose plugin
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Resolve deployment user for Docker group membership
  ansible.builtin.set_fact:
    docker_host_deploy_user: "{{ docker_host_user | default(deploy_remote_user | default(ansible_user | default(''))) | string | trim }}"

- name: Allow the deployment user to run Docker without sudo
  ansible.builtin.user:
    name: "{{ docker_host_deploy_user }}"
    groups: docker
    append: true
  when:
    - docker_host_deploy_user | length > 0
    - docker_host_deploy_user != 'root'

- name: Reset connection so Docker group membership applies
  ansible.builtin.meta: reset_connection
